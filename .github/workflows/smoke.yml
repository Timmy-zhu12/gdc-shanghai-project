name: smoke

on:
  push:
  pull_request:

jobs:
  windows-rule-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python files
        run: python -c "import pathlib, py_compile; files=[pathlib.Path('app.py'), *pathlib.Path('cardio_pc').glob('*.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Run rule-only self-test
        run: python app.py --self-test-rule-only
